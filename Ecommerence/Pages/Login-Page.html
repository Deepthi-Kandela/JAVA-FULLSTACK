<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>
    <video class="bg-video" src="../bg-video.mp4" autoplay muted loop playsinline></video>
    <form action="Home-Page.html">
        <fieldset>
            <legend>Think Mart</legend>
            <h1>Sign-In</h1>

            <label for="username">Username: </label>
            <input type="text" minlength="3" maxlength="10" required id="username" placeholder="Enter Username">

            <br><br>
            <label for="password">Password: </label>
            <input type="password" required minlength="6" maxlength="8" id="password" placeholder="Enter Password">

            <br><br>
            <button type="submit">Login</button>
            <button type="reset">Cancel</button>

            <p class="links">New user? <a href="Register-Page.html">Register here</a></p>
        </fieldset>
    </form>
</body>

</html>
